name: Android dogfood APK (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RNET_TARGET: android-arm64-v8a
      DOGFOOD_ABI: arm64-v8a
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Build standalone dogfood APK
        working-directory: apps/mobile
        run: npm run build:apk:local
      - name: Verify APK and record provenance
        working-directory: apps/mobile
        run: |
          cp dist/momentum-dogfood.apk dist/nf-fit-redesign-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/nf-fit-redesign-arm64.apk
          unzip -p dist/nf-fit-redesign-arm64.apk assets/index.android.bundle > /dev/null
          cd dist
          sha256sum nf-fit-redesign-arm64.apk > SHA256SUMS.txt
          printf 'commit: %s\nbuild: %s\npackage: app.nffit.dogfood\nabi: arm64-v8a\nchannel: dogfood (test signing; no Metro required)\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nf-fit-redesign-arm64
          path: |
            apps/mobile/dist/nf-fit-redesign-arm64.apk
            apps/mobile/dist/SHA256SUMS.txt
            apps/mobile/dist/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
