name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-audit --no-fund
        # Prefer npm ci once package-lock.json is committed.
      - run: npm run typecheck
      - run: npm test
      - run: npm run security:scan
      - name: Mobile typecheck
        if: hashFiles('apps/mobile/package.json') != ''
        run: |
          npm install --no-audit --no-fund --prefix apps/mobile
          npx tsc --noEmit -p apps/mobile
          node scripts/check-mobile-dependencies.mjs
